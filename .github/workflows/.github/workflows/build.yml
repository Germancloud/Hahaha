name: Build FAP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o bt_debug_app.zip -d app_src_tmp
          mv app_src_tmp/bt_debug_app app_src

      - uses: flipperdevices/flipperzero-ufbt-action@v0.1.0
        id: build
        with:
          sdk-channel: release
          app-dir: app_src

      - uses: actions/upload-artifact@v4
        with:
          name: fap
          path: ${{ steps.build.outputs.fap-artifacts }}
